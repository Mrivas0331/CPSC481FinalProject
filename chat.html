<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="chat.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div id="chat-box">
        <div id="start-screen">
            <h1>Hello! Let me see your notes.</h1>
            <textarea id="notes" placeholder="Enter your notes here"></textarea>
            <button id="submit">Simplify Notes</button>
        </div>
        
        <div id="messages"></div>

        <div id="input-container">
            <input id="user-input" placeholder="Type your message here">
            <button id="send">Send</button>
        </div>
    </div>
</body>

<script>
    const submitBtn = document.getElementById('submit');
    const notes = document.getElementById('notes');
    const messages = document.getElementById('messages');
    const startScreen = document.getElementById('start-screen');
    const inputContainer = document.getElementById('input-container');
    const sendBtn = document.getElementById('send');
    let chatHistory = [];

    submitBtn.addEventListener('click', async () => {
        const notesText = notes.value.trim();

        if (!notesText) {
            alert("Please enter some notes!");
            return;
        }

        startScreen.style.display = "none";
        inputContainer.style.display = "flex";

        const userMsg = document.createElement("div");
        userMsg.classList.add("msg", "user");
        userMsg.innerText = notesText;
        messages.appendChild(userMsg);

        const aiMsg = document.createElement("div");
        aiMsg.classList.add("msg", "ai");
        aiMsg.innerText = "Study Steve is thinking ...";
        messages.appendChild(aiMsg);
        notes.value = "";

        try {
            chatHistory.push({
                role: "user",
                content: notesText
            });
            const response = await fetch("http://localhost:8000/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ messages: chatHistory })
            });

            const data = await response.json();
            aiMsg.innerHTML = marked.parse(data.response || "No response from the server.");

            chatHistory.push({
                role: "ai",
                content: aiMsg.innerHTML
            });
        } catch (error) {
            aiMsg.innerText = "Error: couldn't connect to the backend. Is main.py running?";
            console.error("Error:", error);
        }

        messages.scrollTop = messages.scrollHeight;

    });

    inputContainer.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            sendBtn.click();
        }
    });

    sendBtn.addEventListener('click', async () => {
        const userInput = document.getElementById('user-input');
        const userText = userInput.value.trim();

        if (!userText) {
            alert("Please enter a message!");
            return;
        }

        const userMsg = document.createElement("div");
        userMsg.classList.add("msg", "user");
        userMsg.innerText = userText;
        messages.appendChild(userMsg);

        const aiMsg = document.createElement("div");
        aiMsg.classList.add("msg", "ai");
        aiMsg.innerText = "Study Steve is thinking ...";
        messages.appendChild(aiMsg);
        userInput.value = "";

        try {
            chatHistory.push({
                role: "user",
                content: userText
            });

            const response = await fetch("http://localhost:8000/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ messages: chatHistory })
            });

            const data = await response.json();
            aiMsg.innerHTML = marked.parse(data.response || "No response from the server.");

            chatHistory.push({
                role: "ai",
                content: aiMsg.innerHTML
            });
        } catch (error) {
            aiMsg.innerText = "Error: couldn't connect to the backend. Is main.py running?";
            console.error("Error:", error);
        }
        messages.scrollTop = messages.scrollHeight;
    });
</script>
</html>
